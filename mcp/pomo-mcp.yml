note: 'Pomo ships an MCP-SHAPED REST facade, not an MCP server. Seven operations under /api/mcp/* mirror
  the MCP method names — tools/list, tools/execute, resources/list, resources/read, prompts/list, prompts/{prompt_name},
  capabilities — but they are ordinary REST endpoints behind an HTTP bearer token, and there is no JSON-RPC
  transport: POSTing {"jsonrpc":"2.0","method":"tools/list"} to /api/mcp or /api/mcp/ returns HTTP 404.
  No MCP client can connect to Pomo today, so mode is none and NO MCPServer pointer is wired into apis.yml.
  This is a broker the Pomo application calls on its own behalf, most likely to drive the agentic-teams
  surface.'
facade_operations:
- operationId: list_tools_api_mcp_tools_list_get
  method: GET
  path: /api/mcp/tools/list
  auth: HTTPBearer
  probe_status: 401
  description: List all available MCP tools with their schemas. Returns tool definitions suitable for
    LLM function calling.
- operationId: execute_tool_api_mcp_tools_execute_post
  method: POST
  path: /api/mcp/tools/execute
  auth: HTTPBearer
  probe_status: 401
  request_schema: ToolExecuteRequest {tool_name, organization_id, company_profile_id, arguments, confirmation_token,
    conversation_id}
  response_schema: MCPResponse {success, data, error, metadata}
- operationId: list_resources_api_mcp_resources_list_post
  method: POST
  path: /api/mcp/resources/list
  auth: HTTPBearer
  request_schema: ResourceListRequest {resource_type, organization_id, company_profile_id, params}
- operationId: read_resource_api_mcp_resources_read_post
  method: POST
  path: /api/mcp/resources/read
  auth: HTTPBearer
  request_schema: ResourceReadRequest {resource_type, resource_id, organization_id, company_profile_id,
    params}
- operationId: list_prompt_templates_api_mcp_prompts_list_get
  method: GET
  path: /api/mcp/prompts/list
  auth: HTTPBearer
- operationId: get_prompt_template_api_mcp_prompts__prompt_name__get
  method: GET
  path: /api/mcp/prompts/{prompt_name}
  auth: HTTPBearer
- operationId: get_capabilities_api_mcp_capabilities_get
  method: GET
  path: /api/mcp/capabilities
  auth: HTTPBearer
  probe_status: 401
