  /api/external-platform/shopify/install:
    get:
      tags:
      - external-platform
      summary: Shopify Install
      description: 'Shopify-initiated install entry — the app''s configured App URL.


        Verifies the install request HMAC over the raw query string, then redirects to

        Shopify''s OAuth grant. No Pomo profile is known yet; it is resolved after OAuth

        (see /shopify/install/resolve). Keeps installation initiated from a

        Shopify-owned surface with OAuth before any Pomo UI (2.3.1 / 2.3.2).'
      operationId: shopify_install_api_external_platform_shopify_install_get
      parameters:
      - name: shop
        in: query
        required: true
        schema:
          type: string
          title: Shop
      - name: hmac
        in: query
        required: false
        schema:
          type: string
          title: Hmac
      - name: host
        in: query
        required: false
        schema:
          type: string
          title: Host
      - name: timestamp
        in: query
        required: false
        schema:
          type: string
          title: Timestamp
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/external-platform/shopify/install/launch:
    get:
      tags:
      - external-platform
      summary: Shopify Install Launch
      description: 'Top-level launch hop for embedded-initiated installs.


        The App Home''s begin-install runs inside the Admin iframe, where no cookie it

        sets would be visible to the new top-level tab. So begin-install returns THIS

        URL instead of the raw authorize URL: the new tab lands here first-party, gets

        the browser-binding OAuth-state cookie, and is bounced straight to Shopify''s

        grant. Token-gated (signed, 2-minute TTL, shop+origin baked in) — not authed,

        by design: it only starts an OAuth grant for the shop named in the token.'
      operationId: shopify_install_launch_api_external_platform_shopify_install_launch_get
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/external-platform/shopify/connect/start:
    post:
      tags:
      - external-platform
      summary: Shopify Connect Start
      description: 'Pomo-initiated on-ramp. Stashes the pre-known binding intent (as a single-use

        connection request) and returns the App Store listing redirect — a

        Shopify-owned surface.


        The binding intent now travels server-side: a signed ``pomo_shopify_intent``

        cookie carries it across the single Shopify OAuth hop, where the callback

        embeds it into the Redis pending install (the object that follows the install

        to resolve from any tab). The returned ``intent_token`` is retained as a

        backward-compat carrier (older frontends; in-flight installs across the deploy)

        and its absence is now non-fatal. The install stays 2.3.1-compliant either way

        (no manual domain entry).'
      operationId: shopify_connect_start_api_external_platform_shopify_connect_start_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopifyConnectStartRequestModel'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/external-platform/shopify/install/resolve:
    post:
      tags:
      - external-platform
      summary: Shopify Install Resolve
      description: 'Post-OAuth resolution (authenticated). Claims the pending install for the user,

        then binds per the Pomo intent (if present) or the §7 matrix. Returns the

        resolved action + redirect, or a picker payload (needs_org / needs_profile).'
      operationId: shopify_install_resolve_api_external_platform_shopify_install_resolve_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopifyInstallResolveRequestModel'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Shopify Install Resolve Api External Platform Shopify Install Resolve Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/external-platform/shopify/privacy/webhooks:
    post:
      tags:
      - external-platform
      summary: Shopify Privacy Webhook
      description: 'Receive Shopify mandatory privacy compliance webhooks.


        The endpoint is intentionally unauthenticated because Shopify authenticates

        the delivery with X-Shopify-Hmac-SHA256 over the raw body.'
      operationId: shopify_privacy_webhook_api_external_platform_shopify_privacy_webhooks_post
