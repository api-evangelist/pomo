          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/external-platform/meta/launch-job/{job_id}:
    get:
      tags:
      - external-platform
      summary: Get Launch Job Status
      operationId: get_launch_job_status_api_external_platform_meta_launch_job__job_id__get
