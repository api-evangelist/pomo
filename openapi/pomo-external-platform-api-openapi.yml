components:
  schemas:
    SlackLinkResponse:
      properties:
        linked:
          type: boolean
          title: Linked
        slack_team_id:
          type: string
          title: Slack Team Id
        slack_user_id:
          type: string
          title: Slack User Id
      type: object
      required:
      - linked
      - slack_team_id
      - slack_user_id
      title: SlackLinkResponse
    TikTokAuthResponseModel:
      properties:
        auth_url:
          type: string
          title: Auth Url
      type: object
      required:
      - auth_url
      title: TikTokAuthResponseModel
    KlaviyoAccountsResponse:
      properties:
        accounts:
          items:
            $ref: '#/components/schemas/KlaviyoList'
          type: array
          title: Accounts
      type: object
      required:
      - accounts
      title: KlaviyoAccountsResponse
      description: Response model for Klaviyo lists/segments.
    MetaSyncPreviewRequest:
      properties:
        platform_type:
          type: string
          title: Platform Type
          description: meta_feed or meta_stories_reels
        ad_id:
          type: string
          title: Ad Id
          description: ID of the specific ad to sync (UUID string)
        ad_account_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Ad Account Id
          description: Meta Ad Account ID (optional override)
        force_sync_fields:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Force Sync Fields
          description: Optional field allowlist for pending edits that should be previewed.
        pending_update:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Pending Update
          description: Pending Pomo edit payload to preview without saving it.
      type: object
      required:
      - platform_type
      - ad_id
      title: MetaSyncPreviewRequest
      description: Request model for previewing a Meta sync and billing impact.
    SlackChannelResponse:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        is_private:
          type: boolean
          title: Is Private
          default: false
        is_member:
          type: boolean
          title: Is Member
          default: false
      type: object
      required:
      - id
      - name
      title: SlackChannelResponse
    AmazonKeywordsRequest:
      properties:
        profile_id:
          type: string
          title: Profile Id
        ad_group_id:
          type: string
          title: Ad Group Id
        keywords:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Keywords
      type: object
      required:
      - profile_id
      - ad_group_id
      - keywords
      title: AmazonKeywordsRequest
    SquareStatusResponseModel:
      properties:
        connected:
          type: boolean
          title: Connected
          description: Whether the platform is connected
        healthy:
          type: boolean
          title: Healthy
          description: Whether the token is healthy (passed API check)
          default: false
        health_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Health Message
          description: Health check result message
        account_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Account Id
          description: Platform-specific account identifier
        account_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Account Name
          description: Display name for the account
        token_expires_soon:
          type: boolean
          title: Token Expires Soon
          description: Whether token expires within buffer period
          default: false
        last_health_check:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Health Check
          description: ISO timestamp of last health check
        merchant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Merchant Id
          description: Square merchant ID
        business_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Business Name
          description: Business name
        primary_location_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Primary Location Id
          description: Primary location ID
        locations_count:
          type: integer
          title: Locations Count
          description: Number of locations
          default: 0
        granted_scopes:
          items:
            type: string
          type: array
          title: Granted Scopes
          description: Granted Square OAuth scopes
        has_write_access:
          type: boolean
          title: Has Write Access
          description: Whether the current integration includes Square write scopes
          default: false
        write_access_missing_scopes:
          items:
            type: string
          type: array
          title: Write Access Missing Scopes
          description: Missing standard Square write scopes required for sandbox seeding
      type: object
      required:
      - connected
      title: SquareStatusResponseModel
      description: Response model for Square connection status with health check.
      example:
        account_id: shop_12345
        account_name: My Store
        connected: true
        health_message: Token is valid
        healthy: true
        last_health_check: '2024-01-15T10:30:00Z'
        token_expires_soon: false
    GoogleLaunchAdCampaignRequest:
      properties:
        platform_type:
          type: string
          title: Platform Type
          description: 'Type of ad platform: google_display or google_search'
        ad_id:
          type: string
          title: Ad Id
          description: Normalized platform ad ID to launch
        google_account_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Google Account Id
          description: Legacy Google Ads account ID; launches use the active account
        bid_only:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Bid Only
          description: Whether to use 'Observation' (True) or 'Targeting' (False) for audiences
          default: true
        youtube_logo_image_url:
          anyOf:
          - type: string
