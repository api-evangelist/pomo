openapi: 3.2.0
info:
  title: GPT Backend External Platform API
  version: 0.1.0
servers:
- url: https://api.usepomo.ai
  description: Base URL declared by the provider in apis.yml (roadmap#122).
tags:
- name: external-platform
paths:
  /api/external-platform/instagram/auth:
    get:
      tags:
      - external-platform
      summary: Instagram Auth
      description: "Generate an OAuth URL for user authentication.\n\nArgs:\n    login_type: The type of login flow to use. Defaults to \"instagram\".\n               Set to \"facebook\" to use Facebook login instead.\n    db: Database session\n    company_profile: Current company profile (injected via dependency)\n\nReturns:\n    InstagramAuthResponseModel: Response with authentication URL"
      operationId: instagram_auth_api_external_platform_instagram_auth_get
      security:
      - HTTPBearer: []
      parameters:
      - name: login_type
        in: query
        required: false
        schema:
          type: string
          default: instagram
          title: Login Type
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstagramAuthResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/external-platform/instagram/callback:
    get:
      tags:
      - external-platform
      summary: Instagram Callback
      description: "Handle Instagram OAuth callback.\n\nArgs:\n    code: Authorization code from OAuth provider\n    state: State parameter containing user ID and login type\n    error: Error code if authorization failed\n    error_reason: Reason for error if authorization failed\n    error_description: Detailed error description if authorization failed\n    db: Database session\n    \nReturns:\n    RedirectResponse: Redirect to frontend with success or error"
      operationId: instagram_callback_api_external_platform_instagram_callback_get
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
          title: Code
      - name: state
        in: query
        required: false
        schema:
          type: string
          title: State
      - name: error
        in: query
        required: false
        schema:
          type: string
          title: Error
      - name: error_reason
        in: query
        required: false
        schema:
          type: string
          title: Error Reason
      - name: error_description
        in: query
        required: false
        schema:
          type: string
          title: Error Description
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/external-platform/instagram/disconnect:
    post:
      tags:
      - external-platform
      summary: Disconnect Instagram
      operationId: disconnect_instagram_api_external_platform_instagram_disconnect_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/external-platform/instagram/create-post:
    post:
      tags:
      - external-platform
      summary: Create Instagram Post
      description: "Create an Instagram post with an image.\n\nThis endpoint creates a standalone Instagram post not associated with a campaign.\nIt handles authentication, validates the token, and posts content to Instagram.\n\nArgs:\n    post_data: Post content and account details\n    db: Database session\n    company_profile: Current company profile (injected via dependency)\n\nReturns:\n    PostResponseModel: Response with post ID"
      operationId: create_instagram_post_api_external_platform_instagram_create_post_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/external-platform/instagram/delete-post:
    post:
      tags:
      - external-platform
      summary: Delete Instagram Post
      description: "Delete an Instagram post by ID.\n\nThis endpoint deletes a post from Instagram and updates the corresponding\ndatabase records in the SocialPostCampaign table.\n\nArgs:\n    delete_data: Post ID to delete\n    db: Database session\n    company_profile: Current company profile (injected via dependency)\n\nReturns:\n    DeletePostResponseModel: Response with success status"
      operationId: delete_instagram_post_api_external_platform_instagram_delete_post_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletePostRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePostResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/external-platform/instagram/posts:
    get:
      tags:
      - external-platform
      summary: Get Instagram Posts
      description: "Get recent Instagram posts for a specific account.\n\nArgs:\n    instagram_account_id: Instagram business account ID\n    limit: Maximum number of posts to return\n    db: Database session\n    company_profile: Current company profile (injected via dependency)\n\nReturns:\n    dict: Response with list of posts"
      operationId: get_instagram_posts_api_external_platform_instagram_posts_get
      security:
      - HTTPBearer: []
      parameters:
      - name: instagram_account_id
        in: query
        required: true
        schema:
          type: string
          title: Instagram Account Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 25
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/external-platform/instagram/post-metrics:
    post:
      tags:
      - external-platform
      summary: Get Post Metrics
      description: "Get metrics for a specific Instagram post.\n\nArgs:\n    metrics_data: Post ID and metrics to retrieve\n    db: Database session\n    company_profile: Current company profile (injected via dependency)\n\nReturns:\n    dict: Response with metrics data"
      operationId: get_post_metrics_api_external_platform_instagram_post_metrics_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostMetricsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/external-platform/instagram/batch-post-metrics:
    post:
      tags:
      - external-platform
      summary: Get Batch Post Metrics
      description: "Get metrics for multiple Instagram posts in a single request.\n\nArgs:\n    batch_data: Instagram account ID and list of post IDs\n    db: Database session\n    company_profile: Current company profile (injected via dependency)\n\nReturns:\n    dict: Response with metrics for all posts"
      operationId: get_batch_post_metrics_api_external_platform_instagram_batch_post_metrics_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchPostMetricsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/external-platform/instagram/accounts:
    get:
      tags:
      - external-platform
      summary: Get Instagram Accounts
      description: "Get a list of Instagram business accounts that the user has access to.\nThis endpoint handles both Instagram direct authentication and Facebook authentication.\n\nArgs:\n    db: Database session\n    company_profile: Current company profile (injected via dependency)\n\nReturns:\n    dict: Response with list of Instagram accounts and authentication method"
      operationId: get_instagram_accounts_api_external_platform_instagram_accounts_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/external-platform/instagram/activation:
    get:
      tags:
      - external-platform
      summary: Get Instagram Activation
      operationId: get_instagram_activation_api_external_platform_instagram_activation_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/external-platform/instagram/activate:
    post:
      tags:
      - external-platform
      summary: Activate Instagram Identity
      operationId: activate_instagram_identity_api_external_platform_instagram_activate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstagramActivateIdentityRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/external-platform/instagram/post-campaign:
    post:
      tags:
      - external-platform
      summary: Post Campaign To Instagram
      description: "Post a campaign's content to Instagram.\n\nThis endpoint creates a post on Instagram using content from a SocialPostCampaign.\nIt supports both single image posts and carousel posts (multiple images).\n\nArgs:\n    post_data: Campaign and Instagram account info\n    db: Database session\n    company_profile: Current company profile (injected via dependency)\n\nReturns:\n    PostResponseModel: Response with post ID and status\n\nNotes:\n    - For carousel posts, multiple images must be provided in the campaign\n    - If posting a carousel, all images should have the same aspect ratio\n    - Carousel posts are limited to 10 images"
      operationId: post_campaign_to_instagram_api_external_platform_instagram_post_campaign_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstagramPostCampaignRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/external-platform/meta/campaign/{campaign_id}/status:
    get:
      tags:
      - external-platform
      summary: Get Meta Campaign Status
      description: Fetch real-time Meta campaign status (with optional adset/ad) and map to canonical states.
      operationId: get_meta_campaign_status_api_external_platform_meta_campaign__campaign_id__status_get
      security:
      - HTTPBearer: []
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
          title: Campaign Id
      - name: adset_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Adset Id
      - name: ad_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Ad Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/external-platform/meta/auth:
    get:
      tags:
      - external-platform
      summary: Meta Auth
      description: 'Get OAuth authorization URL.


        - auth_type = ''facebook'' returns Meta (Facebook) Ads auth URL and redirects to /meta/callback

        - auth_type = ''instagram'' returns Instagram auth URL and redirects to /instagram/callback (for social posting)'
      operationId: meta_auth_api_external_platform_meta_auth_get
      security:
      - HTTPBearer: []
      parameters:
      - name: auth_type
        in: query
        required: false
        schema:
          type: string
          description: '''facebook'' for Meta Ads; ''instagram'' for Instagram social'
          default: facebook
          title: Auth Type
        description: '''facebook'' for Meta Ads; ''instagram'' for Instagram social'
      - name: capability
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional incremental capability upgrade on the same Meta connection.
          title: Capability
        description: Optional incremental capability upgrade on the same Meta connection.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaAuthResponseModel'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/external-platform/meta/callback:
    get:
      tags:
      - external-platform
      summary: Meta Callback
      description: 'Handle Meta (Facebook) OAuth callback for Ads connection and store tokens.


        Redirects to the frontend PlatformConnectSuccessPage with platform=meta.'
      operationId: meta_callback_api_external_platform_meta_callback_get
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
          title: Code
      - name: state
        in: query
        required: false
        schema:
          type: string
          title: State
      - name: error
        in: query
        required: false
        schema:
          type: string
          title: Error
      - name: error_description
        in: query
        required: false
        schema:
          type: string
          title: Error Description
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/external-platform/meta/accounts:
    get:
      tags:
      - external-platform
      summary: Get Meta Accounts
      description: Get Meta Ad accounts and Facebook Pages for the authenticated user.
      operationId: get_meta_accounts_api_external_platform_meta_accounts_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaAccountsResponseModel'
      security:
      - HTTPBearer: []
  /api/external-platform/meta/activation:
    get:
      tags:
      - external-platform
      summary: Get Meta Activation
      operationId: get_meta_activation_api_external_platform_meta_activation_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/external-platform/meta/disconnect:
    post:
      tags:
      - external-platform
      summary: Disconnect Meta Ads
      operationId: disconnect_meta_ads_api_external_platform_meta_disconnect_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/external-platform/meta/accounts/select:
    post:
      tags:
      - external-platform
      summary: Select Meta Ad Account
      description: Activate one Meta ad account for future launches.
      operationId: select_meta_ad_account_api_external_platform_meta_accounts_select_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetaSelectAdAccountRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/external-platform/meta/activate:
    post:
      tags:
      - external-platform
      summary: Activate Meta Ad Account
      operationId: activate_meta_ad_account_api_external_platform_meta_activate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetaSelectAdAccountRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/external-platform/meta/launch-ad-campaign:
    post:
      tags:
      - external-platform
      summary: Launch Meta Ad Campaign
      description: Queue a Meta ad campaign launch and return a job id for status polling.
      operationId: launch_meta_ad_campaign_api_external_platform_meta_launch_ad_campaign_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetaLaunchAdCampaignRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/external-platform/meta/sync-ad-campaign/preview:
    post:
      tags:
      - external-platform
      summary: Preview Meta Sync
      description: Preview sync changes and billing impact for a Meta ad campaign.
      operationId: preview_meta_sync_api_external_platform_meta_sync_ad_campaign_preview_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetaSyncPreviewRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
