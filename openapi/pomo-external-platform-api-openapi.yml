  /api/external-platform/meta/sync-job/{job_id}:
    get:
      tags:
      - external-platform
      summary: Get Sync Job Status
      operationId: get_sync_job_status_api_external_platform_meta_sync_job__job_id__get
      security:
      - HTTPBearer: []
      parameters:
