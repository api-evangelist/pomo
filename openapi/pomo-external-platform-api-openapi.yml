  /api/external-platform/meta/sync-ad-campaign:
    post:
      tags:
      - external-platform
      summary: Sync Meta Ad Campaign
      description: Queue a Meta ad sync and return a job id for status polling.
      operationId: sync_meta_ad_campaign_api_external_platform_meta_sync_ad_campaign_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetaSyncAdCampaignRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
