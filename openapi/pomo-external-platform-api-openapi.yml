      description: 'Return the URL the embedded page opens (new tab) to (re)run the OAuth grant.


        Works for both bound and unbound shops — a bound shop may re-run OAuth on

        reinstall. The URL is the top-level /install/launch hop (NOT the raw Shopify

        authorize URL): this XHR runs inside the Admin iframe, where no cookie it set

        would be visible to the new tab, and the OAuth state must be browser-bound.

