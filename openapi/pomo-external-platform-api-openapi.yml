  /api/external-platform/meta/campaigns/{campaign_id}/insights:
    get:
      tags:
      - external-platform
      summary: Get Meta Campaign Insights
      description: Get performance insights for a Meta campaign
      operationId: get_meta_campaign_insights_api_external_platform_meta_campaigns__campaign_id__insights_get
      security:
      - HTTPBearer: []
      parameters:
      - name: campaign_id
        in: path
        required: true
        schema:
          type: string
          title: Campaign Id
      - name: date_preset
        in: query
        required: false
        schema:
          type: string
          default: last_7d
          title: Date Preset
      responses:
        '200':
          description: Successful Response
          content:
