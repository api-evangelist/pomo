  /api/workflow/brand-generation/agent-mode/start:
    post:
      tags:
      - brand-workflow
      summary: Start Agent Mode
      description: 'Enable agent mode for a brand workflow and start a background task to

        auto-advance the workflow where possible.'
      operationId: start_agent_mode_api_workflow_brand_generation_agent_mode_start_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentModeStartRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    OnboardingNarrativeRequest:
      properties:
        stage:
          type: string
          enum:
          - assessment
          - competitors
          - gaps
          - ads
          - insights
          title: Stage
        context:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Context
        force_refresh:
          type: boolean
          title: Force Refresh
          default: false
      type: object
      required:
      - stage
      title: OnboardingNarrativeRequest
    MarketingProfileGenerationRequest:
      properties:
        scope_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Scope Key
      type: object
      title: MarketingProfileGenerationRequest
    CompetitorRegenerateRequest:
      properties:
        workflow_id:
          type: string
          format: uuid
          title: Workflow Id
        scope_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Scope Key
      type: object
      required:
      - workflow_id
      title: CompetitorRegenerateRequest
    ConfirmCompetitorsRequest:
      properties:
        workflow_id:
          type: string
          format: uuid
          title: Workflow Id
        selected_competitors:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Selected Competitors
      type: object
      required:
      - workflow_id
      - selected_competitors
      title: ConfirmCompetitorsRequest
    Step2DiscoverRequest:
      properties:
        company_url:
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
          title: Company Url
        company_profile_id:
          type: string
          format: uuid
          title: Company Profile Id
      type: object
      required:
      - company_url
      - company_profile_id
      title: Step2DiscoverRequest
    Step1ConfirmRequest:
      properties:
        company_url:
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
          title: Company Url
        company_profile_id:
          type: string
          format: uuid
          title: Company Profile Id
        company_info:
          $ref: '#/components/schemas/CompanyInfo'
      type: object
      required:
      - company_url
      - company_profile_id
      - company_info
      title: Step1ConfirmRequest
    CompanyUrlPreflightRequest:
      properties:
        company_url:
          type: string
          title: Company Url
      type: object
      required:
      - company_url
      title: CompanyUrlPreflightRequest
    ProductOfferingExtractUrlRequest:
      properties:
        company_profile_id:
          type: string
          format: uuid
          title: Company Profile Id
        page_url:
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
          title: Page Url
        workflow_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Workflow Id
        force_recrawl:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Force Recrawl
          default: false
      type: object
      required:
      - company_profile_id
