openapi: 3.2.0
info:
  title: GPT Backend Brand Workflow API
  version: 0.1.0
servers:
- url: https://api.usepomo.ai
  description: Base URL declared by the provider in apis.yml (roadmap#122).
tags:
- name: brand-workflow
paths:
  /api/workflow/brand-generation/step1/preflight-url:
    post:
      tags:
      - brand-workflow
      summary: Preflight Company Url
      operationId: preflight_company_url_api_workflow_brand_generation_step1_preflight_url_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUrlPreflightRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/workflow/brand-generation/status:
    get:
      tags:
      - brand-workflow
      summary: Get Workflow Status
      operationId: get_workflow_status_api_workflow_brand_generation_status_get
      security:
      - HTTPBearer: []
      parameters:
      - name: company_url
        in: query
        required: true
        schema:
          type: string
          title: Company Url
      - name: company_profile_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Company Profile Id
      - name: workflow_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Workflow Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/workflow/brand-generation/step1/upload-files:
