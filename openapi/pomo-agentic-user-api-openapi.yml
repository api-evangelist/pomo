openapi: 3.2.0
info:
  title: GPT Backend Agentic User API
  version: 0.1.0
tags:
- name: agentic-user
paths:
  /api/agentic/user/conversation-stream:
    get:
      tags:
      - agentic-user
      summary: Stream User Conversation Events
      description: 'Single SSE stream for all conversation updates for a user.


        Publishes events when:

        - New messages are added to any of the user''s conversations (e.g., campaign completion)


        Event payload:

        {

        "type": "message_added",

        "conversation_id": "",

        "message": {

        "id": "",

        "role": "assistant",

        "content": "...",

        "created_at": "..."

        }

        }


        Supports reconnection via last_event_id for delta fetch.'
      operationId: stream_user_conversation_events_api_agentic_user_conversation_stream_get
      security:
      - HTTPBearer: []
      parameters:
      - name: last_event_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Last event ID for replay on reconnection
          title: Last Event Id
        description: Last event ID for replay on reconnection
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
