openapi: 3.2.0
info:
  title: GPT Backend Unified Data Model API
  version: 0.1.0
servers:
- url: https://api.usepomo.ai
  description: Base URL declared by the provider in apis.yml (roadmap#122).
tags:
- name: Unified Data Model
paths:
  /api/udm/revenue/daily:
    get:
      tags:
      - Unified Data Model
      summary: Get daily revenue by channel
      description: Returns daily revenue breakdown by vendor and channel (in-store, online, etc.)
      operationId: get_revenue_daily_api_udm_revenue_daily_get
      security:
      - HTTPBearer: []
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Start date (YYYY-MM-DD). Defaults to 30 days ago.
          title: Start Date
        description: Start date (YYYY-MM-DD). Defaults to 30 days ago.
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: End date (YYYY-MM-DD). Defaults to today.
          title: End Date
        description: End date (YYYY-MM-DD). Defaults to today.
      - name: preset
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Date preset: today, yesterday, last_7_days, last_30_days, this_month, last_month, this_quarter, year_to_date'
          title: Preset
        description: 'Date preset: today, yesterday, last_7_days, last_30_days, this_month, last_month, this_quarter, year_to_date'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RevenueByChannelResponse'
                title: Response Get Revenue Daily Api Udm Revenue Daily Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
