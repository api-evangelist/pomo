      tags:
      - Unified Data Model
      summary: Get revenue summary
      description: Returns aggregated revenue metrics for the specified date range
      operationId: get_revenue_summary_api_udm_revenue_summary_get
      security:
      - HTTPBearer: []
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
