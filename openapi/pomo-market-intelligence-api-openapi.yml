        description: Number of days to look back (ignored when start_date is supplied)
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional start date (YYYY-MM-DD or ISO8601)
          title: Start Date
        description: Optional start date (YYYY-MM-DD or ISO8601)
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional end date (YYYY-MM-DD or ISO8601)
          title: End Date
        description: Optional end date (YYYY-MM-DD or ISO8601)
      - name: include_details
        in: query
        required: false
        schema:
          type: boolean
          description: Return detailed fields (analysis, notable changes, recommendations, news)
          default: true
          title: Include Details
        description: Return detailed fields (analysis, notable changes, recommendations, news)
      - name: include_meta
        in: query
        required: false
        schema:
          type: boolean
          description: Include preview metadata for tier-limited responses
          default: false
          title: Include Meta
        description: Include preview metadata for tier-limited responses
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
