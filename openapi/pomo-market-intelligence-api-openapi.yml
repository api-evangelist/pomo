openapi: 3.2.0
info:
  title: GPT Backend Market Intelligence API
  version: 0.1.0
servers:
- url: https://api.usepomo.ai
  description: Base URL declared by the provider in apis.yml (roadmap#122).
tags:
- name: market-intelligence
paths:
  /api/market-intelligence/intelligence:
    get:
      tags:
      - market-intelligence
      summary: Get Market Intelligence
      description: Get market intelligence data with filters.
      operationId: get_market_intelligence_api_market_intelligence_intelligence_get
      security:
      - HTTPBearer: []
      parameters:
      - name: intelligence_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by type: trend, competitor, opportunity, threat'
          title: Intelligence Type
        description: 'Filter by type: trend, competitor, opportunity, threat'
      - name: impact_level
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Filter by impact level: low, medium, high, critical'
          title: Impact Level
        description: 'Filter by impact level: low, medium, high, critical'
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: product_offering_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Filter by product offering ID (None = company-wide)
          title: Product Offering Id
        description: Filter by product offering ID (None = company-wide)
      - name: days
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Number of days to look back
          default: 30
          title: Days
        description: Number of days to look back
      - name: start_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Start date for filtering (YYYY-MM-DD)
          title: Start Date
        description: Start date for filtering (YYYY-MM-DD)
      - name: end_date
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: End date for filtering (YYYY-MM-DD)
          title: End Date
        description: End date for filtering (YYYY-MM-DD)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarketIntelligenceResponse'
                title: Response Get Market Intelligence Api Market Intelligence Intelligence Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/market-intelligence/intelligence/report-dates:
    get:
      tags:
      - market-intelligence
      summary: Get Intelligence Report Dates
      description: Get distinct dates when intelligence reports were generated.
      operationId: get_intelligence_report_dates_api_market_intelligence_intelligence_report_dates_get
      security:
      - HTTPBearer: []
      parameters:
      - name: product_offering_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: Product offering ID (None = company-wide)
          title: Product Offering Id
        description: Product offering ID (None = company-wide)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
