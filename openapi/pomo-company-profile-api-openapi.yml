          type: string
          format: uuid
          title: Profile Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_image_api_company_profile__profile_id__upload_image_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfileResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
