        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Profile Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Marketing Strategy
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
