  /api/company-profile/{profile_id}/stylebook/generate:
    post:
      tags:
      - company-profile
      summary: Generate Company Stylebook
      operationId: generate_company_stylebook_api_company_profile__profile_id__stylebook_generate_post
      security:
      - HTTPBearer: []
      parameters:
      - name: profile_id
