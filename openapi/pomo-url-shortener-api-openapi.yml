openapi: 3.2.0
info:
  title: GPT Backend URL Shortener API
  version: 0.1.0
tags:
- name: URL Shortener
paths:
  /api/url-shortener/shorten/:
    post:
      tags:
      - URL Shortener
      summary: Create Shortened Url
      description: 'Creates a new shortened URL.


        Args:

        url (ShortenedURLCreate): URL creation data with long_url and campaign_id

        request (Request): FastAPI request object

        db (Session, optional): Database session. Defaults from dependency.

        current_user (User, optional): The current authenticated user. Defaults from dependency.


        Returns:

        ShortenedURLSchema: The created shortened URL data


        Raises:

        HTTPException: If there is an error creating the shortened URL'
      operationId: create_shortened_url_api_url_shortener_shorten__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShortenedURLCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortenedURL'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/url-shortener/s/{short_code}:
    get:
      tags:
      - URL Shortener
      summary: Redirect To Long Url
      description: 'Redirects to the original long URL based on the short code.


        Args:

        short_code (str): The short code to redirect from

        db (Session, optional): Database session. Defaults from dependency.

        request (Request, optional): FastAPI request object. Defaults to None.


        Returns:

        RedirectResponse: Redirect to the original URL


        Raises:

        HTTPException: If the short URL is not found'
      operationId: redirect_to_long_url_api_url_shortener_s__short_code__get
      parameters:
      - name: short_code
        in: path
        required: true
        schema:
          type: string
          title: Short Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ShortenedURL:
      properties:
        long_url:
          type: string
          title: Long Url
        campaign_id:
          type: string
          title: Campaign Id
        short_code:
          type: string
          title: Short Code
        short_url:
          type: string
          title: Short Url
      type: object
      required:
      - long_url
      - campaign_id
      - short_code
      - short_url
      title: ShortenedURL
      description: Full shortened URL model
    ShortenedURLCreate:
      properties:
        long_url:
          type: string
          title: Long Url
        campaign_id:
          type: string
          title: Campaign Id
      type: object
      required:
      - long_url
      - campaign_id
      title: ShortenedURLCreate
      description: Schema for creating a shortened URL
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
