          - type: 'null'
          title: Include Presentation Daily Report
      - name: report_run_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Report Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTeamWorkspaceInitResponse'
        '422':
          description: Validation Error
          content:
