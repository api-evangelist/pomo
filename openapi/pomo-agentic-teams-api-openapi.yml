          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/agentic/teams/fleet:
    get:
      tags:
      - agentic-teams
      summary: Get Team Fleet Snapshot
      operationId: get_team_fleet_snapshot_api_agentic_teams_fleet_get
      security:
      - HTTPBearer: []
      parameters:
      - name: organization_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Organization Id
      - name: company_profile_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Company Profile Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 200
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by team status
          title: Status
        description: Filter by team status
      - name: blocked_only
        in: query
        required: false
        schema:
          type: boolean
          description: Include only blocked teams
          default: false
          title: Blocked Only
        description: Include only blocked teams
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          description: Sort key
          default: updated_at
          title: Sort By
        description: Sort key
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
          description: Sort order (asc|desc)
          default: desc
          title: Sort Order
        description: Sort order (asc|desc)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTeamFleetSnapshotResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
