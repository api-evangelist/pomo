      - HTTPBearer: []
components:
  schemas:
    EarnedMediaTargetUpdateRequest:
      properties:
        status:
          anyOf:
          - type: string
            enum:
            - recommended
            - shortlisted
            - dismissed
          - type: 'null'
          title: Status
        outreach_status:
          anyOf:
          - type: string
            enum:
            - not_started
            - pitch_ready
            - contacted
            - follow_up_due
            - replied
            - interview
            - published
            - not_pursuing
          - type: 'null'
          title: Outreach Status
        last_contacted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Contacted At
        next_follow_up_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Next Follow Up At
        coverage_url:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Coverage Url
        notes:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Notes
      additionalProperties: false
      type: object
      title: EarnedMediaTargetUpdateRequest
    EarnedMediaPressCoverageItem:
      properties:
        id:
          type: string
          maxLength: 80
          minLength: 1
          title: Id
        url:
          type: string
          maxLength: 2000
          minLength: 8
          title: Url
        title:
          type: string
          maxLength: 320
          minLength: 1
          title: Title
        outlet:
          type: string
          maxLength: 220
          title: Outlet
          default: ''
        summary:
          type: string
          maxLength: 600
          title: Summary
          default: ''
        published_on:
          type: string
          maxLength: 40
          title: Published On
          default: ''
        source_category:
          type: string
          maxLength: 64
          title: Source Category
          default: unknown
        independence:
          type: string
          maxLength: 32
          title: Independence
          default: unknown
        review_status:
          type: string
          enum:
          - suggested
          - verified
          - approved
          title: Review Status
          default: suggested
        discovered_at:
          type: string
          maxLength: 40
          title: Discovered At
          default: ''
        added_by:
          type: string
          maxLength: 16
          title: Added By
          default: ''
      additionalProperties: false
      type: object
      required:
      - id
      - url
      - title
      title: EarnedMediaPressCoverageItem
      description: A page that already exists about this brand.
    EarnedMediaPressRoom:
      properties:
        approved_for_publication:
          type: boolean
          title: Approved For Publication
          default: false
        announcement_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Announcement Date
        dateline_city:
          anyOf:
          - type: string
            maxLength: 220
          - type: 'null'
          title: Dateline City
        verified_facts:
          items:
            type: string
            maxLength: 1200
            minLength: 3
          type: array
          maxItems: 20
          title: Verified Facts
        quotes:
          items:
            $ref: '#/components/schemas/EarnedMediaPressQuote'
          type: array
          maxItems: 8
          title: Quotes
        boilerplate:
          anyOf:
          - type: string
            maxLength: 2500
          - type: 'null'
          title: Boilerplate
        media_contact:
          anyOf:
          - $ref: '#/components/schemas/EarnedMediaContact'
          - type: 'null'
        assets:
          items:
            $ref: '#/components/schemas/EarnedMediaPressAsset'
          type: array
          maxItems: 12
          title: Assets
        verification_note:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Verification Note
      additionalProperties: false
      type: object
      title: EarnedMediaPressRoom
      description: Brand-approved facts and assets kept out of public web search.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    EarnedMediaContact:
      properties:
        name:
          type: string
          maxLength: 220
          minLength: 1
          title: Name
        title:
          anyOf:
          - type: string
            maxLength: 220
          - type: 'null'
          title: Title
        email:
          anyOf:
          - type: string
            maxLength: 320
          - type: 'null'
          title: Email
        phone:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Phone
      additionalProperties: false
      type: object
      required:
      - name
      title: EarnedMediaContact
    EarnedMediaPressQuote:
      properties:
        speaker_name:
          type: string
          maxLength: 220
          minLength: 1
          title: Speaker Name
        speaker_title:
          anyOf:
          - type: string
            maxLength: 220
          - type: 'null'
          title: Speaker Title
        quote:
          type: string
          maxLength: 2000
          minLength: 20
          title: Quote
        approved_for_publication:
          type: boolean
          title: Approved For Publication
          default: true
        source_label:
          anyOf:
          - type: string
            maxLength: 220
          - type: 'null'
          title: Source Label
      additionalProperties: false
      type: object
      required:
