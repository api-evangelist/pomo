      required:
      - organization_id
      - company_profile_id
      title: AgentConversationCreate
      description: 'Request schema for creating a new agent conversation.


        Required fields:

        - organization_id: Organization context (for multi-tenant scoping)

        - company_profile_id: Company context (for MCP tools)


        Optional fields:

        - title: Custom title (if not provided, auto-generated from first message)

        - extra: Initial extra data (workflow stage, etc.)'
      example:
        company_profile_id: 123e4567-e89b-12d3-a456-426614174001
        extra:
          workflow_stage: campaign_creation
        organization_id: 123e4567-e89b-12d3-a456-426614174000
        title: Campaign Strategy Discussion
