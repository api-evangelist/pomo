          description: Organization ID for multi-tenant scoping
        company_profile_id:
          type: string
          format: uuid
          title: Company Profile Id
          description: Company profile ID for MCP context
        title:
          anyOf:
          - type: string
            maxLength: 255
          - type: 'null'
          title: Title
          description: Conversation title (auto-generated if not provided)
