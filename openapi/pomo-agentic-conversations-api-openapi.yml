      description: 'How a workspace field entered the evidence plane.


        Lineage is descriptive metadata, not a truth ranking.  In particular,

        ``system_derived`` facts still require support from their underlying

        evidence and ``user_authored`` facts are authoritative only as statements

        of user intent.'
    AgentConversationResponse:
      properties:
        id:
          anyOf:
          - type: string
          - type: 'null'
          title: Id
          description: Conversation ID
        organization_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Organization Id
          description: Organization ID
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
          description: User ID who owns this conversation
        company_profile_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Company Profile Id
          description: Company profile ID
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
          description: Conversation title
        conversation_source:
          type: string
          enum:
          - web
          - slack
          title: Conversation Source
          description: Conversation source label used for UI filtering
          default: web
        runtime_key:
          $ref: '#/components/schemas/RuntimeKey'
          description: Immutable server-selected Markee engine version
          default: legacy
        message_count:
          type: integer
          title: Message Count
          description: Number of messages in conversation
        is_active:
          type: boolean
          title: Is Active
          description: Whether conversation is active (not soft-deleted)
        has_unread:
          type: boolean
          title: Has Unread
          description: True when new messages added by system, False when user views
          default: false
        extra:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Extra
          description: Additional data (stats, workflow state, etc.)
