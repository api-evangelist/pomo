      - company_profile_id
      - message_count
      - is_active
      - created_at
      - updated_at
      - last_message_at
      title: AgentConversationResponse
      description: 'Response schema for agent conversation.


        Uses mixins for consistent UUID serialization:

        - UUIDIdentifierMixin: Handles ''id'' field

        - UserScopedMixin: Handles ''user_id'' field

        - OrganizationScopedMixin: Handles ''organization_id'' field

        - CompanyProfileScopedMixin: Handles ''company_profile_id'' field'
      example:
        company_profile_id: 123e4567-e89b-12d3-a456-426614174001
        created_at: '2025-11-05T20:00:00Z'
        extra:
