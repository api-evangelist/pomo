components:
  schemas:
    AmazonSponsoredBrandsAdRequest:
      properties:
        product_description:
          type: string
          title: Product Description
          description: Description of the product or service
        target_audience:
          type: string
          title: Target Audience
          description: Target audience description
        company_profile_id:
          type: string
          format: uuid
          title: Company Profile Id
          description: Company profile ID (required)
        campaign_goals:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Campaign Goals
          description: List of campaign goals
        key_selling_points:
          type: string
          title: Key Selling Points
          description: Key selling points
          default: ''
        num_ads:
          type: integer
          maximum: 10.0
          minimum: 1.0
          title: Num Ads
          description: Number of ad variations to generate
          default: 3
        bid_strategy:
          type: string
          title: Bid Strategy
          description: Bidding strategy
          default: maximize_conversions
        budget_range:
          type: string
          title: Budget Range
          description: Budget range (low, medium, high, custom)
          default: medium
        country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
          description: Target country
        state_province:
          anyOf:
          - type: string
          - type: 'null'
          title: State Province
          description: Target state/province
        city:
          anyOf:
          - type: string
          - type: 'null'
          title: City
          description: Target city
        locations:
          anyOf:
          - items:
              $ref: '#/components/schemas/LocationItem'
            type: array
          - type: 'null'
          title: Locations
          description: List of locations to target (countries/regions/states/cities/postal codes/proximities). This does not split budget per location; all locations share the campaign budget.
        reference_images:
          anyOf:
          - items:
              type: string
            type: array
            maxItems: 3
          - type: 'null'
          title: Reference Images
          description: List of reference image base64 data URLs (max 3)
        lead_form_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Lead Form Enabled
          description: Whether to use lead form extension where supported
          default: false
        max_cpc:
          anyOf:
          - type: number
            minimum: 0.01
          - type: 'null'
          title: Max Cpc
          description: Maximum cost per click in dollars (e.g., 1.50 for $1.50). Required when bid_strategy is 'MANUAL_CPC'
        experiment_package_id:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Experiment Package Id
          description: Test package id; created campaigns are stamped with this linkage
        launch_strategy_mode:
          anyOf:
          - type: string
            pattern: ^(test_learn_pilot|direct_campaign)$
          - type: 'null'
          title: Launch Strategy Mode
          description: test_learn_pilot or direct_campaign
        dayparting_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Dayparting Enabled
          description: Whether dayparting/ad scheduling is enabled for this campaign
          default: false
        dayparting_config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Dayparting Config
          description: Dayparting configuration including schedule, timezone, and platform-specific settings
        brand_name:
          type: string
          title: Brand Name
          description: Brand name
        num_images_per_ad:
          type: integer
          maximum: 3.0
          minimum: 1.0
          title: Num Images Per Ad
          description: Number of images per ad
          default: 1
        showcase_products:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Showcase Products
          description: Products to showcase
        ad_format:
          anyOf:
          - type: string
          - type: 'null'
          title: Ad Format
          description: Selected ad format (product_collection, store_spotlight, or video)
        video_length:
          anyOf:
          - type: integer
          - type: 'null'
          title: Video Length
          description: Video duration in seconds (for video format)
      type: object
      required:
      - product_description
      - target_audience
      - company_profile_id
      - brand_name
      title: AmazonSponsoredBrandsAdRequest
      description: Request model for Amazon Sponsored Brands ads
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    KeywordWithCpc:
      properties:
        keyword:
          type: string
          title: Keyword
        estimated_cpc:
          anyOf:
          - type: number
          - type: 'null'
          title: Estimated Cpc
      type: object
      required:
      - keyword
      title: KeywordWithCpc
      description: Model for keyword with CPC data
    MetaFeedAdRequest:
      properties:
        product_description:
          type: string
          title: Product Description
