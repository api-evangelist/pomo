          title: Num Ads
          description: Number of ad variations to generate
          default: 3
        bid_strategy:
          type: string
          title: Bid Strategy
          description: Bidding strategy
          default: maximize_conversions
        budget_range:
          type: string
          title: Budget Range
          description: Budget range (low, medium, high, custom)
          default: medium
        country:
          anyOf:
          - type: string
          - type: 'null'
          title: Country
          description: Target country
        state_province:
          anyOf:
          - type: string
          - type: 'null'
          title: State Province
          description: Target state/province
        city:
          anyOf:
          - type: string
          - type: 'null'
          title: City
          description: Target city
        locations:
          anyOf:
          - items:
