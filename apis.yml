aid: pomo
name: Pomo
description: Pomo is an AI marketing platform that runs an always-on AI marketing team, turning continuous
  market, competitor, brand, and trend intelligence into strategy, creative direction, ad-placement planning,
  and launch-ready campaign workflows for lean growth, brand, and performance teams. It monitors signals
  daily, surfaces opportunity and whitespace, drafts approval-ready campaigns, briefs, and creatives,
  and supports AEO/GEO AI-search visibility and Marketing Mix Modeling. Pomo is also offered as a managed
  service where in-house marketing experts operate the platform on a customer's behalf. The platform runs
  on a public FastAPI backend at api.usepomo.ai that publishes an OpenAPI 3.1 contract covering 924 paths
  and 994 operations across campaigns, competitor tracking, market intelligence, earned media, influencer
  discovery, a unified data model, and connectors to Meta, Google, TikTok, LinkedIn, Shopify, Square,
  Stripe, QuickBooks, Klaviyo, HubSpot, and Slack, plus a bearer-gated programmatic API with self-service
  API keys and an internal MCP tool broker. The legal entity is MachFlow, Inc. dba Pomo. Founded in 2025
  and based in Palo Alto, California, Pomo raised a $4.5M seed round led by Kindred Ventures with Databricks
  Ventures, SV Angel, and angel investors.
