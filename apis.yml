apis:
- name: Pomo Platform API
  description: The FastAPI backend behind the Pomo application, published as an OpenAPI 3.1.0 contract
    at https://api.usepomo.ai/openapi.json with interactive Swagger UI and ReDoc renderings. 924 paths
    / 994 operations across campaigns, online ad campaigns, agentic teams and tasks, brand workflow, competitor
    tracking, market intelligence, earned media, influencer discovery and campaigns, a unified data model
    (UDM), company profiles, organizations and members, credits and payments, and a large external-platform
    connector surface (Meta, Instagram, Google, Google Analytics, TikTok, LinkedIn, X, Shopify, Square,
    Stripe, QuickBooks, Klaviyo, HubSpot, Slack, Amazon). Authentication is HTTP bearer (Clerk issued
    session tokens); a separate programmatic tier under /api/programmatic/v1 authenticates with self-service
    API keys minted at /api/programmatic-keys. The contract is published without an access program, developer
    portal, or usage terms — it is the application's own backend, publicly readable rather than a documented
    developer product.
